<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Admin - Luminity{% endblock %}</title>
<style>
  :root{
    --bg:#fff9ee; --ink:#2b261f; --muted:#6b6052; --card:#ffffff; --line:#efe6d8;
    --accent:#ffb300; --accent-deep:#f57c00;
    --ok:#10b981; --warn:#f59e0b; --ng:#ef4444; --pending:#9ca3af;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  a{color:inherit;text-decoration:none}
  .wrap{min-height:100%}

  /* ヘッダー（検索画面のトーンに寄せた柔らかグラデ） */
  header{
    position:sticky;top:0;z-index:10;
    backdrop-filter:saturate(1.2) blur(6px);
    background:
      radial-gradient(900px 360px at 92% -20%, rgba(255,179,0,.20), transparent 60%),
      radial-gradient(720px 360px at -10% 100%, rgba(255,224,130,.24), transparent 60%),
      linear-gradient(160deg,#fff,#fff2cfcc);
    border-bottom:1px solid var(--line);
  }
  .nav{max-width:1200px;margin:0 auto;padding:10px 14px;display:flex;gap:14px;align-items:center}
  .brand{display:flex;gap:10px;align-items:center;font-weight:900}
  .brand i{width:26px;height:26px;border-radius:8px;background:
      radial-gradient(14px 14px at 70% 30%, #fff6, transparent 70%),
      linear-gradient(160deg,var(--accent),var(--accent-deep));display:inline-block}
  .nav a.link{padding:8px 12px;border-radius:12px;border:1px solid transparent}
  .nav a.link:hover{background:#fff; border-color:var(--line)}
  .spacer{flex:1}

  main{max-width:1200px;margin:20px auto 60px;padding:0 14px}
  .hero{border:1px solid var(--line);border-radius:26px;padding:14px;background:
        radial-gradient(900px 360px at 92% -20%, rgba(255,179,0,.20), transparent 60%),
        radial-gradient(720px 360px at -10% 100%, rgba(255,224,130,.24), transparent 60%),
        linear-gradient(160deg,#fff,#fff2cf);margin-bottom:14px}
  .hero h1{font-family:"Shippori Mincho","Noto Serif JP",serif;font-weight:900;font-size:20px;margin:0}

  .grid{display:grid;gap:12px}
  .cols-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:14px}
  .kv{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
  .kv:last-child{border-bottom:none}
  .muted{color:var(--muted)}

  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{background:#fff7d6; font-weight:800}
  tr:last-child td{border-bottom:none}

  .chip,.btn{
    display:inline-flex;align-items:center;gap:8px;
    border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;
    cursor:pointer;font-weight:800;color:var(--ink)
  }
  .btn.primary{background:linear-gradient(180deg,#ffe08a,#ffc44d);border-color:#ffd166}
  .btn.danger{background:#fee2e2;border-color:#fca5a5}
  .badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:12px}
  .badge.ok{background:#ecfdf5;border-color:#86efac}
  .badge.warn{background:#fff7d6;border-color:#fbbf24}
  .badge.ng{background:#fee2e2;border-color:#fca5a5}

  .flash{padding:10px 12px;border-radius:12px;margin:10px 0;border:1px solid var(--line);background:#fff}
  .flash.success{background:#ecfdf5;border-color:#a7f3d0}
  .flash.warning{background:#fff7ed;border-color:#fdba74}
  .flash.error{background:#fef2f2;border-color:#fecaca}

  input,select,textarea,button{font:inherit}
  input[type=text],input[type=search],textarea{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:220px;background:#fff}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="nav">
      <div class="brand"><i aria-hidden="true"></i> <span>Luminity 管理</span></div>
      <a class="link" href="{{ url_for('admin_dashboard') }}">ダッシュボード</a>
      <a class="link" href="{{ url_for('admin_announcements') }}">お知らせ</a>
      <a class="link" href="/admin/claims">オーナー申請</a>
      <a class="link" href="/admin/posts">投稿</a>
      <a class="link" href="/admin/comments">コメント</a>
      <a class="link" href="/admin/tags">タグ</a>
      <div class="spacer"></div>
    </div>
  </header>

  <main>
    <div class="hero"><h1>{% block head %}{% endblock %}</h1></div>

    {% with msgs = get_flashed_messages(with_categories=True) %}
      {% if msgs %}
      <div class="card">
        {% for cat,msg in msgs %}
          <div class="flash {{cat}}">{{ msg }}</div>
        {% endfor %}
      </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</div>
</body></html>
